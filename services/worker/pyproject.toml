[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The worker is normally run from a checkout (``python -m shade_worker``) rather
# than installed, so packaging metadata is here mainly so that a container image
# or a future scheduler can ``pip install .`` it without a separate manifest.
[project]
name = "shade-worker"
version = "0.1.0"
description = "Shade processing plane — turns uploaded documents into Markdown, JSON and retrieval matches."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3.0",
    "redis>=5.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
shade-worker = "shade_worker.__main__:main"

[tool.setuptools.packages.find]
include = ["shade_worker*"]

# ── Pytest ───────────────────────────────────────────────────────────────────
# ``pythonpath = ["."]`` puts this directory (the one containing the
# ``shade_worker`` package) on sys.path, so ``pytest`` invoked from here finds
# the package without an install. When pytest is invoked from the repo root
# instead, this file is not the configfile pytest picks up and the bootstrap in
# ``tests/conftest.py`` does the same job — hence both existing.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:shade_worker.*"]
