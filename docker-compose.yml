# ─────────────────────────────────────────────────────────────────────────────
# Shade — local infrastructure
#
#   docker compose up -d          start PostgreSQL + Redis
#   docker compose down           stop (keeps data volumes)
#   docker compose down -v        stop and wipe data
#
# Application processes (api / web / worker) run on the host via npm & python
# so they can be debugged normally. Only stateful infrastructure lives here.
# ─────────────────────────────────────────────────────────────────────────────

name: shade

services:
  postgres:
    image: postgres:16-alpine
    container_name: shade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shade
      POSTGRES_PASSWORD: shade
      POSTGRES_DB: shade
      # Deterministic collation so ORDER BY on text is stable across machines
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - shade-postgres-data:/var/lib/postgresql/data
      # Applied only on first boot of an empty volume. The API's `db:migrate`
      # script is idempotent and is the source of truth once running.
      - ./apps/api/src/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shade -d shade"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: shade-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - shade-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Optional: S3-compatible object storage for testing the S3 adapter ──────
  # Not started by default. Enable with:
  #   docker compose --profile object-storage up -d
  # then set STORAGE_DRIVER=s3 and S3_ENDPOINT=http://localhost:9000
  minio:
    image: minio/minio:latest
    container_name: shade-minio
    profiles: ["object-storage"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: shade
      MINIO_ROOT_PASSWORD: shade-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - shade-minio-data:/data

volumes:
  shade-postgres-data:
  shade-redis-data:
  shade-minio-data:
